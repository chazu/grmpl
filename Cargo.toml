[workspace]
resolver = "2"
# cargo-fuzz targets: nightly-only, built on their own (`mise run fuzz`).
exclude = ["fuzz"]
members = [
    "crates/grmpl-core",
    "crates/grmpl-diff",
    "crates/grmpl-proc",
    "crates/grmpl-pattern",
    "crates/grmpl-lang",
    "crates/grmpl-type",
    "crates/grmpl-transport",
    "crates/grmpl-session",
    "crates/grmpl-bench",
    "crates/grmpl-cli",
    "crates/grmpl-conformance",
    "crates/grmpl-ent",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
grmpl-core = { path = "crates/grmpl-core" }
fjall = "3.1"
