[package]
name = "grmpl"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The public grmpl runtime facade: compile a language-defined world, bind it to a durable substrate, and drive it through terminal, TCP, or embedded Rust adapters."

[dependencies]
grmpl-ent = { path = "../grmpl-ent" }
grmpl-core = { workspace = true }
grmpl-diff = { path = "../grmpl-diff" }
grmpl-lang = { path = "../grmpl-lang" }
grmpl-pattern = { path = "../grmpl-pattern" }
grmpl-proc = { path = "../grmpl-proc" }

[dev-dependencies]
grmpl-conformance = { path = "../grmpl-conformance" }
tempfile = "3"
